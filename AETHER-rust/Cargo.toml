[package]
name = "dibi-aether"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Cross-platform native desktop shell for OpenDots"

[[bin]]
name = "aether"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
