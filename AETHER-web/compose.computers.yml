# AETHER computer services pinned to AETHER source revision.
# Build both images; only the supervisor is started directly. It creates one
# computer per Dot, with separate named volumes for files and browser profiles.
services:
  computer-image:
    profiles: [build-computers]
    image: aether-computer:latest
    build:
      context: ${AETHER_BOT_REPO:-https://github.com/soumyachk101/AETHER.git#main}
      dockerfile: AETHER-web/deployment/computers/supervisor.Dockerfile
    command: ['true']
  computer-supervisor:
    image: aether-supervisor:latest
    build:
      context: .
      dockerfile: deployment/computers/supervisor.Dockerfile
      additional_contexts:
        aether-bot: ${AETHER_BOT_REPO:-https://github.com/soumyachk101/AETHER.git#main}
    ports:
      - '127.0.0.1:4312:4300'
    environment:
      PORT: '4300'
      SUPERVISOR_TOKEN: ${COMPUTER_SUPERVISOR_TOKEN:?Set COMPUTER_SUPERVISOR_TOKEN in .env}
      COMPUTER_TOKEN: ${COMPUTER_TOKEN:?Set COMPUTER_TOKEN in .env}
      COMPUTER_NAMESPACE: ${COMPUTER_NAMESPACE:-aether}
      COMPUTER_IMAGE: aether-computer:latest
      COMPUTER_BROWSER_MODE: headless
      COMPUTER_NETWORK: ''
      COMPUTER_MEMORY_BYTES: ${COMPUTER_MEMORY_BYTES:-2147483648}
      COMPUTER_RUNTIME: ${COMPUTER_RUNTIME:-}
    volumes:
      - ${ENGINE_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    networks:
      - computer-control
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "const r = await fetch('http://localhost:4300/health'); const j = await r.json(); process.exit(r.ok && j.docker ? 0 : 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
networks:
  computer-control:
    # Host-run apps reach the supervisor through its loopback-only published port.
    driver: bridge
